<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title></title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#00ff66;
    font-family:monospace;
    overflow:hidden;
}

#screen{
    min-height:100vh;
    padding:25px 18px;
    background:
    radial-gradient(circle at center,#102015 0%,#050505 55%);
}

.line{
    margin:13px 0;
    font-size:14px;
}

.progress{
    width:100%;
    height:22px;
    border:1px solid #00ff66;
    margin:18px 0;
    padding:3px;
}

.bar{
    height:100%;
    width:0%;
    background:#00ff66;
    box-shadow:0 0 15px #00ff66;
    transition:.3s;
}

.percent{
    text-align:center;
    font-size:20px;
}

.fake-file{
    color:#aaa;
    font-size:12px;
    margin:7px 0;
}

/* الشاشة السوداء */
#blackScreen{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
}
</style>
</head>

<body>

<div id="screen">

    <div class="line" id="status">
        جاري بدء الفحص...
    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div id="files"></div>

</div>

<div id="blackScreen"></div>

<script>

const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const files = document.getElementById("files");

let progress = 0;

const fakeFiles = [
    "WhatsApp/Media/IMG_20481.jpg",
    "DCIM/Camera/VID_92831.mp4",
    "Android/data/cache.dat",
    "Documents/private_file.pdf",
    "Download/system_backup.zip",
    "Pictures/Screenshot_1829.png",
    "Android/system/cache.tmp",
    "userdata/config.db"
];

function addFile(){

    const div = document.createElement("div");

    div.className = "fake-file";

    div.textContent =
        "▸ قراءة: " +
        fakeFiles[Math.floor(Math.random()*fakeFiles.length)];

    files.prepend(div);

    if(files.children.length > 7)
        files.lastChild.remove();
}

const timer = setInterval(()=>{

    progress += Math.floor(Math.random()*4)+1;

    if(progress >= 100){

        progress = 100;

        bar.style.width = "100%";
        percent.textContent = "100%";

        clearInterval(timer);

        status.textContent = "اكتمل الفحص.";

        // بعد ثانيتين شاشة سوداء
        setTimeout(()=>{
            document.getElementById("blackScreen").style.display = "block";
        },2000);

        return;
    }

    bar.style.width = progress + "%";
    percent.textContent = progress + "%";

    if(progress < 30)
        status.textContent = "جاري فحص الملفات...";

    else if(progress < 60)
        status.textContent = "جاري تحليل بيانات الجهاز...";

    else if(progress < 85)
        status.textContent = "جاري معالجة البيانات...";

    else
        status.textContent = "جاري إنهاء العملية...";

    addFile();

},500);

</script>

</body>
</html>
